version: "3.8"

services:
  db-backup:
    image: tony5188/db-backup-agent:latest
    container_name: db-backup-agent
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./backups:/backups
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SINGLE_USER_MODE: "true"
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-admin}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    security_opt:
      - no-new-privileges:true
